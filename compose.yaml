name: scorta
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@db:5432/inventory
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ALLOWED_HOSTS: api,localhost,127.0.0.1
    command: [alembic, upgrade, head]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: ./backend
    environment: *api-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
volumes:
  inventory-data:
