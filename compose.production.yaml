services:
  gateway:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?Imposta il dominio con DNS diretto al server}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
